<!doctype html>

<body>
  <div class="app-root" data-route="welcome">
    <div class="route-host">
      <main class="welcome-page" data-page="welcome">
      <div class="welcome-background" aria-hidden="true">
        <div class="welcome-background-set welcome-background-dawn">
          <div class="welcome-background-layer welcome-background-first"></div>
          <div class="welcome-background-layer welcome-background-second"></div>
        </div>
        <div class="welcome-background-set welcome-background-star-night">
          <div class="welcome-background-layer welcome-background-first"></div>
          <div class="welcome-background-layer welcome-background-second"></div>
        </div>
      </div>
      <section class="welcome-stage" aria-labelledby="welcome-title">
        <div class="welcome-stack">
          <figure class="welcome-brand"><img src="/assets/welcome/OsisLogo-Main-1024.png" alt="Osis Aurora"></figure>
          <img id="welcome-title" class="welcome-product-title" src="/assets/welcome/Cloudig-Logo-Title-Slogan.svg" alt="采云 Cloudig · 于深渊与星河之间">
          <p class="welcome-greeting" data-i18n="welcome.greeting">你好</p>
          <div class="welcome-identities" aria-label="身份设置">
            <button class="welcome-identity welcome-identity-user" type="button" data-action="edit-identity" data-party="user">
              <span class="welcome-portrait">
                <img class="welcome-avatar" src="/assets/welcome/OsisLogo-Cloudig-1024.png" alt="">
                <img class="welcome-frame welcome-frame-dawn" src="/assets/welcome/Cover-PhotoFrame-Dawn.svg" alt="">
                <img class="welcome-frame welcome-frame-star-night" src="/assets/welcome/Cover-PhotoFrame-StarNight.svg" alt="">
              </span>
              <span class="welcome-identity-name" data-identity-name="user">采云用户</span>
            </button>
            <button class="welcome-identity welcome-identity-assistant" type="button" data-action="edit-identity" data-party="assistant">
              <span class="welcome-portrait">
                <img class="welcome-avatar" src="/assets/welcome/OsisLogo-Simple.svg" alt="">
                <img class="welcome-frame welcome-frame-dawn" src="/assets/welcome/Cover-PhotoFrame-Dawn.svg" alt="">
                <img class="welcome-frame welcome-frame-star-night" src="/assets/welcome/Cover-PhotoFrame-StarNight.svg" alt="">
              </span>
              <span class="welcome-identity-name" data-identity-name="assistant">智能伙伴</span>
            </button>
          </div>
          <nav class="welcome-primary-actions" aria-label="主要入口">
            <button class="cloudig-button cloudig-button-filled welcome-reader-button" type="button" data-route-target="reader" data-i18n="welcome.reader">阅览室</button>
            <button class="cloudig-button cloudig-button-outline welcome-archiver-button" type="button" data-route-target="archiver" data-i18n="welcome.archiver">档案馆</button>
          </nav>
          <section class="welcome-introduction">
            <button class="welcome-theme-switch" type="button" data-action="toggle-theme" aria-label="切换破晓 / 星夜主题" data-i18n-title="welcome.themeTooltip" title="切换破晓 / 星夜主题">
              <img class="welcome-theme-icon welcome-theme-icon-dawn" src="/assets/welcome/OsisLogo-Simple-Mono-Purple.svg" alt="">
              <img class="welcome-theme-icon welcome-theme-icon-star-night" src="/assets/welcome/OsisLogo-Simple-Mono-Orange.svg" alt="">
            </button>
            <p class="welcome-introduction-copy">
              <span data-i18n="welcome.introLine1">采云是将不同AI平台的对话采回本地阅读的开源工具</span>
              <span data-i18n="welcome.introLine2">安装书签→保存对话→本地解析→阅读浏览</span>
            </p>
          </section>
          <footer class="welcome-footer">
            <span class="welcome-release"><span>V1.0.6</span> <span data-i18n="welcome.releaseName">东方既白</span> ·</span>
            <button type="button" data-action="check-update" data-i18n="welcome.checkUpdate">检查更新</button>
            <button type="button" data-action="open-docs" data-i18n="welcome.docs">功能文档</button>
            <button type="button" data-action="toggle-language" data-i18n="welcome.languageSwitch">ENGLISH</button>
          </footer>
        </div>
      </section>
      </main>
    </div>
    <div class="overlay-root" aria-live="polite">
      <div class="route-transition" aria-hidden="true"><img src="/assets/reader/Waiting-Sun.gif" alt=""></div>
    </div>
  </div>
  <template id="reader-cover-template">
    <section class="reader-page" data-page="reader" data-reader-view="cover">
      <header class="reader-topbar">
        <button class="reader-brand" type="button" data-route-target="welcome" data-i18n-title="reader.returnWelcome" title="返回采云封面">
          <img class="reader-brand-logo reader-theme-dawn" src="/assets/reader/OsisLogo-Cloudig-RedBackWhiteAbyss.svg" alt="">
          <img class="reader-brand-logo reader-theme-star-night" src="/assets/reader/OsisLogo-Cloudig-PurpleBackOrangeAbyss.svg" alt="">
          <img class="reader-brand-title reader-theme-dawn" src="/assets/reader/Cloudig-Title-Chinese-Grey-Dark-1024.png" data-brand-english="/assets/reader/Cloudig-Title-English-Grey-Dark.svg" alt="采云">
          <img class="reader-brand-title reader-theme-star-night" src="/assets/reader/Cloudig-Title-Chinese-Grey-Light-1024.png" data-brand-english="/assets/reader/Cloudig-Title-English-Grey-Light.svg" alt="采云">
          <img class="reader-brand-slogan reader-theme-dawn reader-language-zh" src="/assets/reader/Cloudig-Slogan-Chinese-Grey-Dark-1024.png" alt="于深渊与星河之间">
          <img class="reader-brand-slogan reader-theme-star-night reader-language-zh" src="/assets/reader/Cloudig-Slogan-Chinese-Grey-Light-1024.png" alt="于深渊与星河之间">
          <img class="reader-brand-slogan reader-theme-dawn reader-language-en" src="/assets/reader/Cloudig-Slogan-English-Grey-Dark.svg" alt="From the Abyss to the Stars">
          <img class="reader-brand-slogan reader-theme-star-night reader-language-en" src="/assets/reader/Cloudig-Slogan-English-Grey-Light.svg" alt="From the Abyss to the Stars">
        </button>
        <div class="reader-total-pill" aria-live="polite"><i aria-hidden="true"></i><span data-reader-total data-i18n="reader.noConversations">暂无会话</span></div>
        <nav class="reader-topbar-actions" aria-label="阅览室全局操作" data-i18n-title="reader.globalActions">
          <button class="cloudig-button cloudig-button-filled cloudig-page-switch reader-manage-archives" type="button" data-route-target="archiver" data-i18n="reader.manageArchives">管理档案</button>
          <span class="cloudig-version-block reader-version"><strong>V1.0.6</strong><small data-i18n="welcome.releaseName">东方既白</small></span>
          <button class="reader-text-action" type="button" data-action="check-update" data-i18n="welcome.checkUpdate">检查更新</button>
          <button class="reader-text-action" type="button" data-action="toggle-language" data-i18n="welcome.languageSwitch">ENGLISH</button>
          <button class="reader-topbar-theme" type="button" data-action="toggle-theme" data-i18n-title="welcome.themeTooltip" title="切换破晓 / 星夜主题">
            <img class="reader-theme-dawn" src="/assets/reader/OsisLogo-Simple-Mono-Red.svg" alt="">
            <img class="reader-theme-star-night" src="/assets/welcome/OsisLogo-Simple-Mono-Orange.svg" alt="">
          </button>
        </nav>
      </header>

      <div class="reader-body">
        <aside class="reader-catalog" data-reader-catalog>
          <form class="reader-catalog-search" data-reader-search>
            <input type="search" maxlength="256" autocomplete="off" data-reader-search-input data-i18n-placeholder="reader.searchPlaceholder" placeholder="搜索标题或正文">
            <button type="submit" data-i18n-title="reader.search" title="搜索" aria-label="搜索"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="5.5"></circle><path d="m15 15 5 5"></path></svg></button>
            <button type="button" data-reader-search-clear data-i18n-title="reader.clearSearch" title="清除搜索" aria-label="清除搜索" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 7 10 10M17 7 7 17"></path></svg></button>
          </form>

          <section class="reader-platform-region" aria-label="平台筛选" data-i18n-title="reader.platformFilter">
            <span class="reader-wood-rail reader-wood-rail-top" aria-hidden="true"></span>
            <div class="reader-platform-filter" id="reader-platform-filter" data-reader-platforms></div>
            <span class="reader-wood-rail reader-wood-rail-bottom"><button class="reader-platform-all" type="button" data-reader-platform-all aria-pressed="true" title="显示全部平台">全部</button><button class="reader-platform-toggle" type="button" data-reader-platform-toggle aria-expanded="true" aria-controls="reader-platform-filter" title="折叠来源选择" aria-label="折叠来源选择"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 9 5 5 5-5"></path></svg></button></span>
          </section>

          <section class="reader-directory-region" aria-label="目录选择" data-i18n-title="reader.directoryPicker">
            <span class="reader-wood-rail reader-directory-rail-top" aria-hidden="true"></span>
            <div class="reader-directory-shelf">
              <button class="reader-all-directory" type="button" aria-pressed="true" data-reader-directory="all" title="所有目录">
                <img class="reader-theme-dawn reader-directory-selected" src="/assets/reader/AllDirectory-Selected-Dawn.svg" alt="">
                <img class="reader-theme-dawn reader-directory-unselected" src="/assets/reader/AllDirectory-UnSelected-Dawn.svg" alt="">
                <img class="reader-theme-star-night reader-directory-selected" src="/assets/reader/AllDirectory-Selected-StarNight.svg" alt="">
                <img class="reader-theme-star-night reader-directory-unselected" src="/assets/reader/AllDirectory-UnSelected-StarNight.svg" alt="">
                <span data-i18n="reader.allDirectories">所有目录</span>
              </button>
              <div class="reader-directory-books" data-reader-directories></div>
            </div>
            <div class="reader-directory-actions" aria-label="目录操作">
              <button type="button" data-reader-directory-action="new" data-i18n="reader.newDirectory" aria-haspopup="dialog" aria-controls="reader-directory-create-dialog">新建目录</button>
              <button type="button" data-reader-directory-action="expand" data-i18n="reader.expandDirectories">展开目录</button>
              <button type="button" data-reader-directory-action="manage" data-i18n="reader.manageDirectories">管理目录</button>
            </div>
            <span class="reader-wood-rail reader-directory-rail-bottom" aria-hidden="true"></span>
          </section>

          <section class="reader-sort-region" aria-label="排序" data-i18n-title="reader.sort">
            <span class="reader-sort-count"><span data-i18n="reader.visiblePrefix">显示&nbsp;</span><span data-reader-visible-count>0</span>/<span data-reader-total-count>0</span><span data-i18n="reader.conversationUnit">篇</span></span>
            <button type="button" data-reader-time-field aria-haspopup="dialog" aria-controls="reader-time-field-popover" aria-expanded="false" title="时间类型"><img src="/assets/reader/Button-Time-LightCone.svg" alt=""></button>
            <button type="button" data-reader-sort-action="time_asc" data-selected="false" title="时间顺序"><img src="/assets/reader/Button-Time-Clock.svg" alt=""></button>
            <button type="button" data-reader-sort-action="time_desc" data-selected="true" title="时间倒序"><img src="/assets/reader/Button-Time-Tea.svg" alt=""></button>
            <button type="button" data-reader-sort-action="title" data-selected="false" title="标题排列"><img src="/assets/reader/Button-Name-Flower.svg" alt=""></button>
          </section>

          <div class="reader-conversation-list" data-reader-list data-scroll-region aria-live="polite"></div>
          <div class="reader-catalog-folded-navigation" aria-label="折叠目录会话导航">
            <button type="button" data-reader-previous aria-label="上一篇会话"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m4 13 6-7 6 7z"></path></svg></button>
            <button type="button" data-reader-next aria-label="下一篇会话"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m4 7 6 7 6-7z"></path></svg></button>
          </div>
          <div class="reader-catalog-toggle-zone">
            <button class="reader-catalog-toggle reader-catalog-collapse" type="button" data-reader-catalog-toggle="collapse" aria-label="折叠对话目录"><svg viewBox="0 0 20 44" aria-hidden="true"><rect x="1" y="1" width="18" height="42" rx="7"></rect><path d="m12.5 14-7 8 7 8z"></path></svg></button>
            <button class="reader-catalog-toggle reader-catalog-expand" type="button" data-reader-catalog-toggle="expand" aria-label="展开对话目录"><svg viewBox="0 0 20 44" aria-hidden="true"><rect x="1" y="1" width="18" height="42" rx="7"></rect><path d="m7.5 14 7 8-7 8z"></path></svg></button>
          </div>
          <section class="reader-directory-overlay" data-reader-directory-overlay data-i18n-title="reader.expandedDirectories" aria-label="全部目录" hidden>
            <div class="reader-directory-overlay-list" data-reader-directory-overlay-list data-scroll-region></div>
            <footer>
              <button class="cloudig-button cloudig-button-filled" type="button" data-reader-directory-confirm data-i18n="reader.confirmSelection">确认选择</button>
              <button class="cloudig-button cloudig-button-outline" type="button" data-reader-directory-cancel data-i18n="reader.cancel">取消</button>
            </footer>
          </section>
          <div class="reader-row-menu-portal" data-reader-row-menu-portal hidden></div>
        </aside>

            <section class="time-editor-section">
              <header><h2 data-time-editor-copy="counterparts">对映的时间与时间轴</h2><button type="button" data-time-editor-add-counterpart data-time-editor-copy="addCounterpart">添加对映时间与时间轴</button></header>
              <div class="time-editor-list" data-time-editor-counterparts></div>
            </section>
            <section class="time-editor-section">
              <header><h2 data-time-editor-copy="children">包含时间与子时间轴</h2><span class="time-editor-section-actions"><button type="button" data-time-editor-add-child data-time-editor-copy="addChild">添加包含时间与子时间轴</button><button type="button" data-time-editor-sort-children>排序</button><button type="button" data-time-editor-order-confirm data-time-editor-copy="confirm" hidden>确认</button><button type="button" data-time-editor-order-cancel data-time-editor-copy="cancel" hidden>取消</button></span></header>
              <div class="time-editor-list" data-time-editor-children></div>
            </section>
            <section class="time-editor-inline-editor" data-time-editor-inline hidden></section>
          </div>
          <footer class="time-editor-footer"><p data-time-editor-status></p><div><button class="cloudig-button cloudig-button-filled" type="submit" data-time-editor-save data-time-editor-copy="save">保存</button><button class="cloudig-button cloudig-button-filled time-editor-cancel" type="button" data-time-editor-cancel data-time-editor-copy="cancel">取消</button></div></footer>
        </main>
        <aside class="time-cover-bank time-cover-sovereign time-editor-bank">
          <header class="time-cover-bank-header">
            <img class="time-cover-bank-logo" src="/assets/editor/TimeLOGO-Sovereign.svg" alt="">
            <strong data-time-editor-copy="sovereignTitle">独立时间体系</strong>
            <button type="button" data-time-editor-cover><img class="time-cover-cloud time-cover-cloud-dawn" src="/assets/editor/TimeCloud-Blue.svg" alt=""><img class="time-cover-cloud time-cover-cloud-night" src="/assets/editor/TimeCloud-DarkGrey.svg" alt=""><span data-time-editor-copy="returnTop">返回顶层</span></button>
            <button class="time-cover-sort" type="button" data-time-editor-sort title="排序">◷</button>
            <small data-time-editor-copy="sovereignVersion">时间与时间轴列表</small>
          </header>
          <div class="time-cover-bank-list" data-time-editor-sovereign-list data-scroll-region></div>
        </aside>
        <section class="time-editor-impact" data-time-editor-impact role="alertdialog" aria-modal="true" hidden>
          <h2 data-time-editor-copy="impactTitle">确认时间系统修改</h2>
          <div data-time-editor-impact-body data-scroll-region></div>
          <footer><button class="cloudig-button cloudig-button-outline" type="button" data-time-impact-cancel data-time-editor-copy="cancel">取消</button><button class="cloudig-button cloudig-button-filled" type="button" data-time-impact-confirm data-time-editor-copy="confirm">确认</button></footer>
        </section>
      </form>
    </div>
  </template>
  <template id="system-log-template">
    <div class="system-log-layer" data-system-log-layer>
      <section class="system-log-dialog" data-system-log-dialog role="dialog" aria-modal="true" aria-labelledby="system-log-title">
        <header class="system-log-header"><h1 id="system-log-title" data-system-log-title>系统日志</h1><div class="system-log-header-actions"><button class="cloudig-button cloudig-button-outline" type="button" data-system-log-refresh>刷新</button><button class="cloudig-button cloudig-button-outline" type="button" data-system-log-clear>清空日志</button><button class="cloudig-button cloudig-button-outline" type="button" data-system-log-close>关闭</button></div></header>
        <div class="system-log-list" data-system-log-list data-scroll-region></div>
        <p class="system-log-status" data-system-log-status role="status" hidden></p>
      </section>
    </div>
  </template>
  <template id="identity-editor-template">
    <div class="identity-editor-layer" data-identity-layer>
      <form class="identity-editor-dialog" data-identity-dialog novalidate>
        <header class="identity-editor-header">
          <span class="identity-editor-mark" aria-hidden="true">✦</span>
          <div><h1 data-identity-title>全局名称与头像设置</h1><p data-identity-context hidden></p></div>
        </header>
        <div class="identity-editor-body" data-identity-body data-scroll-region>
          <section class="identity-editor-conversation" data-identity-conversation hidden>
            <header><h2 data-identity-copy="conversationTitle">本篇对话名称</h2><button type="button" data-identity-reset-conversation data-identity-copy="resetConversation">恢复本篇默认名称</button></header>
            <div class="identity-editor-conversation-fields">
              <label><span data-identity-copy="conversationUser">本篇用户名</span><input type="text" data-identity-conversation-user></label>
              <label><span data-identity-copy="conversationAssistant">本篇智能名字</span><input type="text" data-identity-conversation-assistant></label>
            </div>
          </section>
          <section class="identity-editor-global">
            <h2 data-identity-copy="globalTitle">全局名称与头像</h2>
            <div class="identity-editor-global-grid" data-identity-global-grid></div>
          </section>
          <p class="identity-editor-callout" data-identity-callout><i aria-hidden="true">i</i><span data-identity-copy="scopeNote">每篇对话可单独改用户名和会话智能名字：打开阅读器→点击会话→点击名字。</span></p>
          <section class="identity-editor-platforms">
            <header><h2 data-identity-copy="platformTitle">模型名称与头像设定</h2><button type="button" data-identity-reset-platforms data-identity-copy="resetPlatforms">恢复全部平台默认值</button></header>
            <div class="identity-editor-platform-grid" data-identity-platform-grid></div>
          </section>
        </div>
        <p class="identity-editor-status" data-identity-status role="status" hidden></p>
        <footer class="identity-editor-footer"><button class="cloudig-button cloudig-button-outline" type="button" data-identity-cancel data-identity-copy="cancel">取消</button><button class="cloudig-button cloudig-button-filled" type="submit" data-identity-save data-identity-copy="save">保存</button></footer>
      </form>
    </div>
  </template>
  <script defer src="/runtime/conversation-renderer.js"></script>
  <script type="module" src="/shell.js"></script>
</body>
</html>
