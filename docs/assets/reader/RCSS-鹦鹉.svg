      .parrot-head-part,
      .parrot-tail-part {
        transform-box: view-box;
        will-change: transform;
      }

      .parrot-head-part {
        transform-origin: 31px 34px;
        animation: parrot-look-around 6.4s ease-in-out infinite;
      }

      .parrot-tail-part {
        transform-origin: 82px 104px;
        animation: parrot-tail-fan 15.2s ease-in-out -4.1s infinite;
      }

      @keyframes parrot-look-around {
        0%, 100% { transform: rotate(-1deg); }
        30% { transform: rotate(-5deg); }
        60% { transform: rotate(3deg); }
        82% { transform: rotate(-2deg); }
      }

      @keyframes parrot-tail-fan {
        0%, 38%, 100% { transform: rotate(0deg); }
        46% { transform: rotate(2.6deg); }
        55% { transform: rotate(-1.4deg); }
        64% { transform: rotate(0deg); }
      }

      @media (prefers-reduced-motion: reduce) {
        .parrot-head-part,
        .parrot-tail-part { animation: none !important; }
      }
    </style>
  </defs>
