      }

      .cls-4 {
        fill: #a67c52;
      }

      .cls-5 {
        fill: #c8c9ca;
      }

      .cat-tail-motion {
        transform-box: view-box;
        will-change: transform;
      }

      .cat-tail-motion {
        transform-origin: 47px 138px;
        animation: cat-tail-sway 5.8s ease-in-out infinite;
      }

      @keyframes cat-tail-sway {
        0%, 12%, 100% { transform: rotate(0deg); }
        24% { transform: rotate(5.5deg); }
        39% { transform: rotate(-3.8deg); }
        55% { transform: rotate(3deg); }
        70% { transform: rotate(-2deg); }
        84% { transform: rotate(1deg); }
      }

      @media (prefers-reduced-motion: reduce) {
        .cat-tail-motion { animation: none !important; }
      }
    </style>
